[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-sliding-window"
version = "0.3.0"
description = "sliding window rate limiter for FastAPI"
readme = "README_en.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "drawiks" }]
keywords = ["fastapi", "rate-limit", "sliding-window", "middleware"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.100.0",
    "starlette>=0.27.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.25",
    "httpx2>=2.0.0",
    "uvicorn>=0.23",
    "pre-commit>=3.0",
    "mypy>=2.0",
]

[project.urls]
Homepage = "https://github.com/drawiks/fastapi-sliding-window"
Repository = "https://github.com/drawiks/fastapi-sliding-window"

[tool.setuptools.packages.find]
where = ["."]
include = ["fastapi_sliding_window*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
extend-select = ["B", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S", "T201", "ANN", "PLR", "ARG", "SLF001"]

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = "redis.*"
ignore_missing_imports = true
